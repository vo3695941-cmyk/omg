<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Captcha Toán Học</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
        }
        .captcha-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 20px;
        }
        .captcha-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .question {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            background: #eef2f3;
            padding: 8px 15px;
            border-radius: 5px;
            letter-spacing: 2px;
            user-select: none;
        }
        .refresh-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #3498db;
            transition: transform 0.2s;
        }
        .refresh-btn:hover {
            transform: rotate(90deg);
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="number"]:focus {
            border-color: #3498db;
        }
        button.validate-btn {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.validate-btn:hover {
            background: #27ae60;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

<div class="captcha-container">
    <h2>Xác minh bạn là con người</h2>
    
    <div class="captcha-box">
        <div class="question" id="captcha-question">0 + 0 = ?</div>
        <button class="refresh-btn" onclick="generateCaptcha()" title="Đổi câu hỏi">🔄</button>
    </div>

    <!-- Thêm sự kiện onkeyup để nhấn Enter là nộp bài luôn -->
    <input type="number" id="captcha-answer" placeholder="Nhập kết quả tại đây" required onkeyup="if(event.key === 'Enter') checkAnswer()">
    <button class="validate-btn" onclick="checkAnswer()">Xác Nhận</button>

    <div id="message"></div>
</div>

<script>
    let correctAnswer = 0;

    function generateCaptcha() {
        const operators = ['+', '-', '×', '÷'];
        const op = operators[Math.floor(Math.random() * operators.length)];
        let num1, num2;

        switch(op) {
            case '+':
                num1 = Math.floor(Math.random() * 50) + 1;
                num2 = Math.floor(Math.random() * 50) + 1;
                correctAnswer = num1 + num2;
                break;
            case '-':
                num1 = Math.floor(Math.random() * 50) + 10; 
                num2 = Math.floor(Math.random() * num1);
                correctAnswer = num1 - num2;
                break;
            case '×':
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                correctAnswer = num1 * num2;
                break;
            case '÷':
                num2 = Math.floor(Math.random() * 9) + 2; 
                correctAnswer = Math.floor(Math.random() * 10) + 1;
                num1 = num2 * correctAnswer;
                break;
        }

        document.getElementById('captcha-question').innerText = `${num1} ${op} ${num2} = ?`;
        document.getElementById('captcha-answer').value = '';
        document.getElementById('message').innerText = '';
    }

    function checkAnswer() {
        const userAnswer = parseInt(document.getElementById('captcha-answer').value, 10);
        const messageDiv = document.getElementById('message');

        if (isNaN(userAnswer)) {
            messageDiv.className = 'error';
            messageDiv.innerText = 'Vui lòng nhập câu trả lời!';
            return;
        }

        if (userAnswer === correctAnswer) {
            messageDiv.className = 'success';
            messageDiv.innerText = '🎉 Đúng rồi! Đang chuyển hướng...';
            
            // Thực hiện chuyển hướng đến trang real.html sau 1 giây để người dùng kịp nhìn thông báo thành công
            setTimeout(function() {
                window.location.href = "real.html";
            }, 1000);
            
        } else {
            messageDiv.className = 'error';
            messageDiv.innerText = '❌ Sai rồi! Vui lòng thử lại.';
            generateCaptcha();
        }
    }

    window.onload = generateCaptcha;
</script>

</body>
</html>
